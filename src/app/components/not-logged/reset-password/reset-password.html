<div id="reset-password-container" class="container">
  <div class="row justify-content-center">
    <div class="login-box p-4">
      <h1 class="mb-4">Redefinir senha</h1>

      <form>
        <div class="mb-3">
          <input
            type="email"
            class="form-control custom-input"
            placeholder="Informe o e-mail cadastrado"
            id="email"
            name="email"
          />
        </div>

        <button type="submit" class="btn btn-danger w-100 custom-button mb-3">
          Enviar
        </button>

        <div class="text-center new-here">
          <a href="/login" class="text-danger text-decoration-none ms-2"> Voltar para o login </a>
        </div>
      </form>
    </div>
  </div>
</div>
