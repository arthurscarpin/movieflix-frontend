<div class="container">
    <div class="logo text-center mb-4">
        <img src="/images/logo.png" alt="logo">
    </div>

    <div class="create-movie-container">
        <h1 class="text-center mb-5">Cadastre seu filme aqui</h1>

        <form>
            <div class="row">

                <div class="col-md-6 mb-4">
                    <input
                        type="text"
                        class="form-control custom-input"
                        placeholder="Nome do filme"
                        id="title"
                        name="title"
                        required>
                </div>

                <div class="col-md-6 mb-4">
                    <input
                        type="text"
                        class="form-control custom-input"
                        placeholder="Descrição do filme"
                        id="description"
                        name="description"
                        required>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="input-group">
                        <input
                            type="text"
                            class="form-control custom-input"
                            placeholder="dd/mm/yyyy"
                            id="releaseDate"
                            name="releaseDate"
                            required>

                        <span class="input-group-text custom-icon">
                            <i class="bi bi-calendar text-danger"></i>
                        </span>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="input-group">
                        <input
                            type="number"
                            class="form-control custom-input"
                            placeholder="Avaliação geral"
                            id="rating"
                            name="rating"
                            min="0"
                            max="10"
                            step="0.1"
                            required>

                        <span class="input-group-text custom-icon">
                            <i class="bi bi-star text-danger"></i>
                        </span>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <select
                        class="form-select custom-input"
                        id="category"
                        name="category"
                        required>

                        <option value="" disabled selected>
                            Qual categoria
                        </option>

                        <option value="1">Ação</option>
                        <option value="2">Comédia</option>
                        <option value="3">Drama</option>
                        <option value="4">Terror</option>
                    </select>
                </div>

                <div class="col-md-6 mb-4">
                    <select
                        class="form-select custom-input"
                        id="service"
                        name="service"
                        required>

                        <option value="" disabled selected>
                            Aonde está disponível?
                        </option>

                        <option value="1">Netflix</option>
                        <option value="2">Amazon Prime</option>
                        <option value="3">Disney+</option>
                        <option value="4">HBO Max</option>
                    </select>
                </div>

            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn custom-button">
                    Cadastrar filme
                </button>
            </div>
        </form>

    </div>
</div>
