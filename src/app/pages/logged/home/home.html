<app-header />

<div class="page-actions container mt-5 mb-3">
  <div class="d-flex justify-content-start align-items-center">
    <a href="/novo-filme" class="btn btn-danger px-4 py-2 fw-semibold">Cadastrar filme</a>
  </div>
</div>

<hr class="section-divider" />

<section class="movie-grid container-fluid px-3 px-md-4">
  @for (movie of movies; track movie.title) {
    <app-card
      [title]="movie.title"
      [description]="movie.description"
      [duration]="movie.duration"
      [ageRating]="movie.ageRating"
      [approvalRating]="movie.approvalRating"
      [providerLogo]="movie.providerLogo"
      [isTop10]="movie.isTop10"
    />
  }
</section>
